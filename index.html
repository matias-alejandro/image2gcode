<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image 2 G-Code</title>
</head>

<body>
  <div id="app">
    <div id="gcode-preview-container" class="preview-container">
      <canvas id="gcode-canvas"></canvas>
      <div class="preview-label">Image 2 G-Code</div>
    </div>

    <div class="actions">
      <button id="load-btn" title="Load File">
        <img src="folder.svg" alt="Load File">
      </button>
      <input type="file" id="file-input" accept="image/*,.gcode" style="display: none;" />
      <button id="save-btn">
        <img src="save.svg" alt="Save">
      </button>
      <button id="settings-btn">
        <img src="settings.svg" alt="Settings">
      </button>
    </div>

    <div id="output-log" class="output-log"></div>

    <div id="settings-modal" class="modal">
      <div class="modal-content">
        <h2 style="margin-top: 0; margin-bottom: 1.5rem;">Settings</h2>
        <div class="form-group">
          <label for="grid-size">Grid Size (mm)</label>
          <input type="number" id="grid-size" value="1000" step="10">
        </div>
        <div class="form-group">
          <label for="grid-divisions">Grid Divisions</label>
          <input type="number" id="grid-divisions" value="100">
        </div>
        <div class="modal-actions">
          <button id="close-settings">Close</button>
          <button id="apply-settings">Apply</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
